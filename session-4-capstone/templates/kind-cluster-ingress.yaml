kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s101
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # image: kindest/node:v1.30.8
    extraPortMappings:
      # Sessions 3 and 4: NodePort 30080 reachable as http://localhost:30080
      # - containerPort: 30080
      #   hostPort: 30080
      #   protocol: TCP
      # Session 4 Ingress bonus. Unused if you skip it — but adding a port
      # mapping later means deleting and recreating the cluster, so it is here now.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
