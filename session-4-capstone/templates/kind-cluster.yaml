kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s101
nodes:
  - role: control-plane
    # image: kindest/node:v1.30.8
    extraPortMappings:
      # Sessions 3 and 4: NodePort 30080 reachable as http://localhost:30080
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Session 4 Ingress bonus. Unused if you skip it — but adding a port
      # mapping later means deleting and recreating the cluster, so it is here now.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
